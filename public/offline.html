<!doctype html>
<html lang="de">
<head>

  <meta name="theme-color" content="#14223F" />
  <title>Offline — The Padellers</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center; background: #14223F; color: #FDFCFB;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 0; max-width: 320px; line-height: 1.5; color: #C9D0E0; }
    button {
      margin-top: 8px; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 16px; font-weight: 700;
      background: #F18CBE; color: #14223F;
    }
  </style>
</head>
<body>
  <h1>Du bist offline</h1>
  <p>Diese Seite wurde noch nicht geladen. Sobald du wieder Empfang hast, geht es weiter.</p>
